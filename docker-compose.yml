services:
  db:
    image: pgvector/pgvector:pg16
    container_name: acme-db
    environment:
      POSTGRES_DB: acme
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"   # only reachable from this computer
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d acme"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
